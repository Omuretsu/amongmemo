<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Among Memo — AirShip</title>
  <style>
    :root { color-scheme: dark; --bg:#10161f; --panel:#18212d; --panel2:#202c3b; --line:#33465d; --text:#edf3f8; --muted:#9eafc0; --accent:#58d6b0; --danger:#fb7185; --warn:#f9c74f; --blue:#7db7ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
    header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:16px; padding:14px max(18px,calc((100% - 1440px)/2)); background:#111a25ee; border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    h1 { margin:0; font-size:20px; letter-spacing:.03em; } h1 span { color:var(--accent); } .status { color:var(--muted); font-size:12px; margin-left:auto; }
    main { max-width:1440px; margin:auto; padding:20px 18px 42px; } .grid { display:grid; grid-template-columns:1.1fr 1.4fr 1fr; gap:16px; align-items:start; } .span2 { grid-column:span 2; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; } h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; } h2 small { color:var(--muted); font-weight:400; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .row + .row { margin-top:9px; }.between { justify-content:space-between; }
    label { color:var(--muted); font-size:12px; display:block; } input, select, textarea, button { font:inherit; } input,select,textarea { color:var(--text); background:#111925; border:1px solid var(--line); border-radius:7px; padding:8px 9px; } input:focus,select:focus,textarea:focus { outline:2px solid #58d6b077; border-color:var(--accent); } textarea { width:100%; min-height:58px; resize:vertical; } button { border:0; border-radius:7px; padding:8px 11px; color:#07231e; background:var(--accent); font-weight:700; cursor:pointer; } button:hover { filter:brightness(1.08); } button.secondary { color:var(--text); background:var(--panel2); border:1px solid var(--line); } button.danger { color:white; background:#bd3852; } button.small { padding:4px 7px; font-size:12px; } .grow { flex:1; min-width:110px; }
    .pill { display:inline-flex; align-items:center; padding:2px 7px; border-radius:999px; background:#25364a; color:var(--muted); font-size:11px; }.alive { color:#69e5c0; }.dead { color:#ff91a1; }.ejected { color:#f9c74f; }
    .players { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:7px; }.player { display:flex; align-items:center; gap:6px; padding:7px; border:1px solid var(--line); border-radius:7px; background:#121b26; }.player select { padding:3px; font-size:11px; margin-left:auto; max-width:68px; }
    .log { display:grid; gap:9px; max-height:440px; overflow:auto; padding-right:3px; }.card { background:#121b26; border-left:3px solid var(--blue); border-radius:6px; padding:9px; }.card.meeting { border-left-color:var(--warn); }.card h3 { font-size:13px; margin:0 0 5px; }.meta { color:var(--muted); font-size:12px; }.detail { margin-top:5px; white-space:pre-wrap; }.tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }.tag { font-size:11px; padding:2px 5px; background:#26394e; border-radius:4px; }
    .shortcuts { color:var(--muted); font-size:12px; margin:7px 0 0; }.shortcut { color:var(--accent); font-family:ui-monospace,monospace; }
    .airship-map { height:clamp(390px,32vw,500px); margin-top:10px; border:1px solid var(--line); border-radius:9px; background:linear-gradient(135deg,#121e2b,#152738); position:relative; overflow:hidden; }.airship-map::before { content:'AIRSHIP'; position:absolute; inset:auto 13px 7px auto; color:#37516b; letter-spacing:.2em; font-size:11px; font-weight:800; }.map-room { position:absolute!important; z-index:1; min-width:0; border:1px solid #476784!important; color:var(--text)!important; background:#1d405d!important; padding:3px 5px!important; font-size:clamp(9px,.72vw,12px)!important; line-height:1.15; font-weight:700!important; text-align:center; overflow-wrap:anywhere; box-shadow:inset 0 0 0 1px #6da6c422; }.map-room:hover,.map-room:focus-visible { background:#286080!important; border-color:var(--accent)!important; outline:2px solid #58d6b088; }.map-room .map-key { color:#84e6d0; font:800 1.2em ui-monospace,monospace; margin-left:3px; white-space:nowrap; }.map-room[data-room="ミーティングルーム"] { background:#31527a!important; border-color:#86aeda!important; }.map-room[data-room="金庫室"],.map-room[data-room="アーカイブ"] { border-radius:16px; }.map-room[data-room="展望デッキ"] { border-radius:0 0 16px 16px; }.map-room[data-room="ラウンジ"] { clip-path:polygon(0 0,100% 0,100% 100%,50% 100%,50% 24%,0 24%); border-radius:0!important; }.map-room[data-room="ラウンジ"] .room-name { position:absolute; top:5%; left:7%; }.map-room[data-room="ラウンジ"] .map-key { position:absolute; top:5%; left:30%; }.map-room[data-room="診察室"] { clip-path:polygon(0 0,100% 0,100% 50%,50% 50%,50% 100%,0 100%); border-radius:0!important; }.map-room[data-room="診察室"] .room-name { position:absolute; top:58%; left:8%; }.map-room[data-room="診察室"] .map-key { position:absolute; top:58%; left:30%; }
    .path { min-height:42px; background:#111925; border:1px solid var(--line); border-radius:7px; padding:7px; color:var(--text); }.path .room { display:inline-block; margin:2px; padding:2px 6px; background:#243a52; border-radius:4px; }.path .room.repair { color:#ffe58a; background:#5a491f; border:1px solid #927526; }.path .room button { padding:0 3px; background:transparent; color:#a8bed5; }
    .hidden { display:none!important; }.empty { color:var(--muted); font-size:13px; padding:7px 0; } #toast { position:fixed; right:18px; bottom:18px; z-index:8; padding:9px 13px; border-radius:8px; background:#244b40; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; } #toast.show { opacity:1; transform:translateY(0); }
    dialog { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(560px,calc(100% - 30px)); padding:18px; } dialog::backdrop { background:#0009; } dialog h2 { margin-bottom:14px; }.formgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }.formgrid .full { grid-column:1/-1; } .checklist { display:flex; flex-wrap:wrap; gap:6px; max-height:115px; overflow:auto; padding:5px; background:#111925; border-radius:7px; }.checklist label { display:flex; align-items:center; gap:4px; color:var(--text); font-size:13px; }.checklist input { accent-color:var(--accent); }
    @media(max-width:950px) { .grid { grid-template-columns:1fr 1fr; }.span2 { grid-column:span 2; } } @media(max-width:620px) { header { flex-wrap:wrap; }.status { margin-left:0; }.grid,.span2 { grid-template-columns:1fr; grid-column:span 1; }.formgrid { grid-template-columns:1fr; }.formgrid .full { grid-column:auto; }.airship-map { display:grid; grid-template-columns:repeat(2,1fr); grid-auto-rows:42px; height:auto; gap:5px; padding:7px; }.map-room { position:relative!important; inset:auto!important; width:auto!important; height:auto!important; min-height:42px; } }
  </style>
</head>
<body>
<header><h1>AMONG <span>MEMO</span></h1><div class="row"><button class="secondary small" id="newGame">新規ゲーム</button><button class="secondary small" id="copyLog">テキストをコピー</button></div><span class="status" id="saveStatus">自動保存済み</span></header>
<main>
  <div class="grid">
    <section>
      <h2>試合設定 <small>AirShip / 10〜13人</small></h2>
      <div class="row"><label class="grow">自分の名前<select id="me" style="width:100%"></select></label><label>役職<select id="role"><option>クルー</option><option>インポスター</option><option>第三陣営</option></select></label></div>
      <div class="row" style="margin-top:10px"><button id="manageMembers" class="secondary">メンバー管理</button><button id="importMembers" class="secondary">JSON読込</button><button id="exportMembers" class="secondary">JSON保存</button><input type="file" id="memberFile" accept="application/json" class="hidden"></div>
      <p class="shortcuts">登録メンバーから今回の参加者を選びます。データはこのブラウザに保存されます。</p>
      <div id="players" class="players" style="margin-top:10px"></div>
    </section>

    <section class="span2">
      <div class="row between"><h2>現在のターン <small id="turnLabel">T1</small></h2><button id="finishTurn" class="secondary">ターンを確定</button></div>
      <div class="row"><label class="grow">自分の移動経路<div id="path" class="path"></div></label></div>
      <div class="airship-map" id="roomButtons" aria-label="AirShipの部屋配置"></div><p class="shortcuts">マップ上の部屋を押すか、各ボタン右側の<span class="shortcut">緑色のキー</span>で移動先を追加（<span class="shortcut">⇧</span>はShiftキー）。<span class="shortcut">1</span> 停電修理 / <span class="shortcut">2</span> コミュニケーション修理 / <span class="shortcut">3</span> リアクター修理を経路に追加。<span class="shortcut">Backspace</span> で最後を削除。</p>
      <div class="formgrid" style="margin-top:10px"><label>自分が見た人・場所<input id="seen" placeholder="例：Alice @ メインホール、Bob @ 金庫室"></label><label>補足メモ<input id="turnNote" placeholder="例：Aliceと約10秒同席"></label></div>
      <div class="row" style="margin-top:10px"><button id="addSabo" class="secondary">＋ 妨害修理を記録</button><button id="openMeeting">会議を開始</button></div>
    </section>

    <section class="span2"><div class="row between"><h2>タイムライン</h2><span class="meta">ターンと会議を時系列で表示</span></div><div id="timeline" class="log"></div></section>
    <section><h2>死亡・キル照合</h2><div id="deathBoard" class="log"></div></section>
    <section><h2>妨害修理ログ</h2><div id="saboLog" class="log"></div></section>
  </div>
</main>

<dialog id="membersDialog"><h2>メンバー管理</h2><div class="row"><input id="newMemberName" class="grow" placeholder="名前を入力して追加"><button id="addMember">追加</button></div><div id="memberList" class="log" style="margin-top:12px"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="secondary closeDialog">閉じる</button></div></dialog>
<dialog id="saboDialog"><h2>妨害修理を記録</h2><div class="formgrid"><label>妨害<select id="saboType"><option>通信</option><option>停電</option><option>原子炉</option><option>ドア</option><option>その他</option></select></label><label>修理者<select id="saboFixer"></select></label><label>場所<input id="saboPlace" placeholder="例：通信室"></label><label>補足<input id="saboNote" placeholder="任意"></label></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="secondary closeDialog">キャンセル</button><button id="saveSabo">記録</button></div></dialog>
<dialog id="meetingDialog"><h2>会議を記録</h2><div class="formgrid"><label>会議種別<select id="meetingType"><option value="button">緊急ボタン</option><option value="report">死体通報</option></select></label><label>起票者（ボタン使用者／通報者）<select id="reporter"></select></label><label id="victimWrap">死亡者<select id="victim"></select></label><label id="bodyPlaceWrap">死体の発見場所<input id="bodyPlace" placeholder="例：アーカイブ"></label><label class="full">視認情報<input id="witness" placeholder="例：T2終盤、AliceがBobを金庫室で視認"></label><label class="full">会議メモ<input id="meetingNote" placeholder="発言・推理・重要情報"></label><label>投票・結果<input id="meetingResult" placeholder="例：Charlie追放（不明）／スキップ"></label><div class="full"><label>キル不可能者（この死亡への白根拠）</label><div id="alibiPeople" class="checklist"></div></div><label class="full">不可能の理由・補足<textarea id="alibiReason" placeholder="例：T2終盤までBobと金庫室に同席。自分が視認。"></textarea></label></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="secondary closeDialog">キャンセル</button><button id="saveMeeting">会議を保存</button></div></dialog>
<div id="toast"></div>

<script>
(() => {
  const KEY = 'among-memo-v1';
  // サンプル図を基にした AirShip の通路・部屋配置（x, y, 幅, 高さ）
  const rooms = [
    ['ミーティングルーム','q',420,15,240,50], ['金庫室','b',80,80,150,35], ['宿舎前通路','y',230,80,130,35],
    ['左昇降機','x',360,80,150,35], ['ぬーん','u',510,80,150,35], ['右昇降機上','z',660,80,150,35], ['アーカイブ','a',810,80,150,35],
    ['通信室','t',80,135,150,45], ['エンジン縦通路','r',230,115,130,75], ['右昇降機下','j',660,115,150,35], ['シャワー縦通路','f',810,115,150,75], ['ラウンジ','l',960,80,300,150],
    ['コックピット','c',0,190,150,40], ['通信前通路','p',150,190,80,40], ['エンジン横通路','e',230,190,130,40], ['メイン左','m',360,190,130,40], ['メイン中央','o',490,160,170,70], ['メイン右','v',660,190,150,40],
    ['シャワー室','h',810,190,150,40], ['シャワー奥','F',960,160,150,40], ['シャワーベント','J',960,200,150,30], ['貨物室','g',1110,160,150,100], ['はしご','H',660,230,150,35],
    ['武器庫','w',150,230,80,70], ['キッチン','k',230,260,130,85], ['キッチン・セキュリティ通路','O',360,300,140,35], ['セキュリティルーム','s',500,300,160,35], ['電気室','n',660,265,300,70], ['診察室','i',960,260,300,85], ['展望デッキ','d',80,300,150,80], ['展望先端','P',80,380,150,35], ['セキュリティ先端','R',500,335,160,35]
  ];
  const $ = s => document.querySelector(s), esc = s => String(s || '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  let state = JSON.parse(localStorage.getItem(KEY) || 'null') || { members: [], game: { me:'', role:'クルー', participants:[], turn:1, path:[], seen:'', note:'', timeline:[], sabotages:[], deaths:[] } };
  const g = () => state.game;
  function save(msg='自動保存済み') { localStorage.setItem(KEY, JSON.stringify(state)); $('#saveStatus').textContent = msg; clearTimeout(save.timer); save.timer=setTimeout(()=>$('#saveStatus').textContent='自動保存済み',1300); }
  function toast(msg) { const t=$('#toast'); t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800); }
  function active() { return g().participants.filter(p=>p.active); }
  function playerOptions(selected='', includeEmpty=true) { return `${includeEmpty?'<option value="">選択…</option>':''}${active().map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}`; }
  function name(id) { return active().find(p=>p.id===id)?.name || state.members.find(p=>p.id===id)?.name || '—'; }
  function render() {
    $('#me').innerHTML=playerOptions(g().me); $('#role').value=g().role; $('#turnLabel').textContent=`T${g().turn}`;
    $('#players').innerHTML=active().length ? active().map(p=>`<div class="player"><span>${esc(p.name)}</span><select data-status="${esc(p.id)}"><option value="alive" ${p.status==='alive'?'selected':''}>生存</option><option value="dead" ${p.status==='dead'?'selected':''}>死亡</option><option value="ejected" ${p.status==='ejected'?'selected':''}>追放</option></select></div>`).join('') : '<p class="empty">メンバー管理から参加者を登録してください。</p>';
    $('#path').innerHTML=g().path.length ? g().path.map((r,i)=>`<span class="room ${r.startsWith('⚡')?'repair':''}">${esc(r)} <button data-remove-path="${i}" title="削除">×</button></span>`).join(' → ') : '<span class="meta">移動先を追加</span>';
    $('#seen').value=g().seen; $('#turnNote').value=g().note;
    $('#timeline').innerHTML=g().timeline.length ? [...g().timeline].reverse().map(item => item.kind==='turn' ? `<article class="card"><h3>T${item.turn} <span class="pill">行動</span></h3><div class="detail"><b>経路：</b>${esc(item.path.join(' → ') || '—')}<br><b>視認：</b>${esc(item.seen || '—')}<br><b>メモ：</b>${esc(item.note || '—')}</div></article>` : `<article class="card meeting"><h3>会議 ${item.type==='button'?'緊急ボタン':'死体通報'} <span class="pill">T${item.turn}</span></h3><div class="detail"><b>起票：</b>${esc(name(item.reporter))}${item.victim?`　<b>死亡：</b>${esc(name(item.victim))} @ ${esc(item.bodyPlace||'不明')}`:''}<br><b>視認：</b>${esc(item.witness||'—')}<br><b>結果：</b>${esc(item.result||'—')}<br><b>メモ：</b>${esc(item.note||'—')}</div>${item.alibis?.length?`<div class="tags">${item.alibis.map(a=>`<span class="tag">${esc(name(a.player))}：${esc(a.reason||'白根拠')}</span>`).join('')}</div>`:''}</article>`).join('') : '<p class="empty">まだ記録はありません。</p>';
    $('#saboLog').innerHTML=g().sabotages.length ? [...g().sabotages].reverse().map(s=>`<article class="card"><h3>T${s.turn} ${esc(s.type)}</h3><div class="detail"><b>修理：</b>${esc(name(s.fixer))}${s.place?` @ ${esc(s.place)}`:''}${s.note?`<br>${esc(s.note)}`:''}</div></article>`).join('') : '<p class="empty">修理記録はありません。</p>';
    $('#deathBoard').innerHTML=g().deaths.length ? [...g().deaths].reverse().map(d=>`<article class="card meeting"><h3>${esc(name(d.victim))} <span class="dead">死亡</span> <small>T${d.turn}</small></h3><div class="detail"><b>発見：</b>${esc(name(d.reporter))} @ ${esc(d.bodyPlace||'不明')}<br><b>視認：</b>${esc(d.witness||'—')}</div>${d.alibis?.length?`<div class="tags">${d.alibis.map(a=>`<span class="tag">キル不可：${esc(name(a.player))}<br>${esc(a.reason||'理由未記入')}</span>`).join('')}</div>`:'<div class="meta">キル不可能者は未記録</div>'}</article>`).join('') : '<p class="empty">死亡情報はありません。</p>';
  }
  function commitTurn() { const has=g().path.length||g().seen||g().note; if(!has) return false; g().timeline.push({kind:'turn',turn:g().turn,path:[...g().path],seen:g().seen,note:g().note}); g().path=[];g().seen='';g().note=''; return true; }
  function nextTurn() { commitTurn(); g().turn++; save(); render(); toast(`T${g().turn} を開始しました`); }
  function openDialog(id) { $(id).showModal(); }
  function fillMeeting() { ['reporter','victim'].forEach(id=>$('#'+id).innerHTML=playerOptions()); $('#alibiPeople').innerHTML=active().filter(p=>p.status==='alive').map(p=>`<label><input type="checkbox" value="${esc(p.id)}">${esc(p.name)}</label>`).join(''); }
  function idFor(n) { return `${Date.now()}-${Math.random().toString(36).slice(2,7)}-${n}`; }
  const keyLabel = key => key && key===key.toUpperCase() ? `⇧${key.toLowerCase()}` : key;
  $('#roomButtons').innerHTML=rooms.map(([room,key,x,y,w,h])=>`<button class="map-room" style="left:${2+x/1260*96}%;top:${2+y/430*96}%;width:${w/1260*96}%;height:${h/430*96}%" data-room="${esc(room)}" title="短縮キー：${keyLabel(key)}"><span class="room-name">${esc(room)}</span> <span class="map-key">${keyLabel(key)}</span></button>`).join('');
  const repairLabels={'停電':'⚡ 停電を修理','通信':'⚡ コミュニケーションを修理','原子炉':'⚡ リアクターを修理'};
  const repairTypeForLabel=label=>Object.keys(repairLabels).find(type=>repairLabels[type]===label);
  function removePathAt(index) { const removed=g().path.splice(index,1)[0],type=repairTypeForLabel(removed); if(type){for(let i=g().sabotages.length-1;i>=0;i--){const s=g().sabotages[i];if(s.turn===g().turn&&s.type===type&&s.fixer===g().me){g().sabotages.splice(i,1);break;}}} }
  function recordRepair(type,fixer,place='',note='') { g().sabotages.push({turn:g().turn,type,fixer,place,note}); if(fixer===g().me)g().path.push(repairLabels[type]||`⚡ ${type}を修理`); }
  document.addEventListener('click', e => {
    const room=e.target.closest('[data-room]'); if(room){g().path.push(room.dataset.room);save();render();return;}
    const rm=e.target.closest('[data-remove-path]'); if(rm){removePathAt(+rm.dataset.removePath);save();render();return;}
    const status=e.target.closest('[data-status]'); if(status && e.target.tagName==='SELECT'){const p=active().find(x=>x.id===status.dataset.status);p.status=e.target.value;save();render();}
  });
  function quickRepair(type) { if(!g().me) return toast('先に「自分の名前」を選択してください'); recordRepair(type,g().me,'','ショートカット記録'); save(); render(); toast(`${repairLabels[type].replace('⚡ ','')}を経路に追加しました`); }
  document.addEventListener('keydown', e => { if(e.target.matches('input,textarea,select') || document.querySelector('dialog[open]')) return; if(e.key==='Backspace'){if(g().path.length)removePathAt(g().path.length-1);save();render();e.preventDefault();return;} const repairs={'1':'停電','2':'通信','3':'原子炉'}; if(repairs[e.key]){quickRepair(repairs[e.key]);e.preventDefault();return;} const found=rooms.find(([,key])=>key===e.key); if(found){g().path.push(found[0]);save();render();e.preventDefault();} });
  $('#me').onchange=e=>{g().me=e.target.value;save()}; $('#role').onchange=e=>{g().role=e.target.value;save()}; $('#seen').oninput=e=>{g().seen=e.target.value;save()}; $('#turnNote').oninput=e=>{g().note=e.target.value;save()};
  $('#finishTurn').onclick=nextTurn;
  $('#openMeeting').onclick=()=>{commitTurn();fillMeeting();$('#meetingDialog').showModal();};
  $('#addSabo').onclick=()=>{ $('#saboFixer').innerHTML=playerOptions(); openDialog('#saboDialog'); };
  $('#saveSabo').onclick=()=>{ const fixer=$('#saboFixer').value,type=$('#saboType').value; if(!fixer)return toast('修理者を選択してください');recordRepair(type,fixer,$('#saboPlace').value.trim(),$('#saboNote').value.trim());$('#saboDialog').close();save();render();toast(fixer===g().me?'修理を経路に追加しました':'修理を記録しました'); };
  $('#meetingType').onchange=()=>{const report=$('#meetingType').value==='report';$('#victimWrap').classList.toggle('hidden',!report);$('#bodyPlaceWrap').classList.toggle('hidden',!report);};
  $('#saveMeeting').onclick=()=>{ const type=$('#meetingType').value, reporter=$('#reporter').value, victim=$('#victim').value; if(!reporter)return toast('起票者を選択してください'); if(type==='report'&&!victim)return toast('死亡者を選択してください'); const ids=[...$('#alibiPeople').querySelectorAll(':checked')].map(x=>x.value); const reason=$('#alibiReason').value.trim(); const alibis=ids.map(player=>({player,reason})); const m={kind:'meeting',turn:g().turn,type,reporter,victim: type==='report'?victim:'',bodyPlace:$('#bodyPlace').value.trim(),witness:$('#witness').value.trim(),note:$('#meetingNote').value.trim(),result:$('#meetingResult').value.trim(),alibis}; g().timeline.push(m); if(type==='report'){const p=active().find(p=>p.id===victim);if(p)p.status='dead';g().deaths.push({...m});} $('#meetingDialog').close(); g().turn++; save(); render(); toast(`会議を保存。T${g().turn} を開始しました`); };
  $('#manageMembers').onclick=()=>{renderMemberList();openDialog('#membersDialog');};
  function renderMemberList(){ $('#memberList').innerHTML=state.members.length?state.members.map(m=>`<div class="row card"><span class="grow">${esc(m.name)}</span><label><input type="checkbox" data-member-active="${esc(m.id)}" ${active().some(p=>p.id===m.id)?'checked':''}> 今回参加</label><button class="danger small" data-delete-member="${esc(m.id)}">削除</button></div>`).join(''):'<p class="empty">メンバーがいません。</p>'; }
  $('#addMember').onclick=()=>{ const n=$('#newMemberName').value.trim();if(!n)return; const m={id:idFor('member'),name:n};state.members.push(m);g().participants.push({...m,active:true,status:'alive'});$('#newMemberName').value='';save();renderMemberList();render(); };
  $('#memberList').onclick=e=>{const b=e.target.closest('[data-delete-member]');if(!b)return;const id=b.dataset.deleteMember;state.members=state.members.filter(m=>m.id!==id);g().participants=g().participants.filter(m=>m.id!==id);if(g().me===id)g().me='';save();renderMemberList();render();};
  $('#memberList').onchange=e=>{const box=e.target.closest('[data-member-active]');if(!box)return;const id=box.dataset.memberActive;let p=g().participants.find(p=>p.id===id);if(box.checked&&!p){const m=state.members.find(m=>m.id===id);g().participants.push({...m,active:true,status:'alive'});}if(!box.checked&&p)g().participants=g().participants.filter(p=>p.id!==id);save();render();};
  $('.closeDialog').onclick=()=>{}; document.querySelectorAll('.closeDialog').forEach(b=>b.onclick=()=>b.closest('dialog').close());
  $('#newGame').onclick=()=>{if(!confirm('現在の試合ログを消去して新規ゲームを開始しますか？ メンバー一覧は残ります。'))return;state.game={me:'',role:'クルー',participants:state.members.map(m=>({...m,active:true,status:'alive'})),turn:1,path:[],seen:'',note:'',timeline:[],sabotages:[],deaths:[]};save();render();toast('新規ゲームを開始しました');};
  $('#exportMembers').onclick=()=>{ const blob=new Blob([JSON.stringify({members:state.members},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='among-members.json';a.click();URL.revokeObjectURL(a.href);toast('メンバーJSONを保存しました');};
  $('#importMembers').onclick=()=>$('#memberFile').click(); $('#memberFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.members))throw Error();state.members=data.members.filter(m=>m&&m.name).map(m=>({id:m.id||idFor('member'),name:String(m.name)}));g().participants=state.members.map(m=>({...m,active:true,status:'alive'}));g().me='';save();render();toast(`${state.members.length}名を読み込みました`);}catch{toast('正しいメンバーJSONではありません');}e.target.value='';};
  $('#copyLog').onclick=async()=>{const lines=[`Among Memo / ${g().role}`,`自分: ${name(g().me)}`, '', ...g().timeline.map(x=>x.kind==='turn'?`[T${x.turn}] 経路: ${x.path.join(' → ')||'—'} / 視認: ${x.seen||'—'} / ${x.note||''}`:`[会議 T${x.turn}] ${x.type==='button'?'ボタン':'通報'}: ${name(x.reporter)}${x.victim?` / 死亡: ${name(x.victim)} @ ${x.bodyPlace||'不明'}`:''}\n視認: ${x.witness||'—'} / 結果: ${x.result||'—'}${x.alibis?.length?`\nキル不可: ${x.alibis.map(a=>`${name(a.player)}（${a.reason||'理由なし'}）`).join('、')}`:''}`)];try{await navigator.clipboard.writeText(lines.join('\n'));toast('試合ログをコピーしました');}catch{toast('コピーできませんでした');}};
  render();
})();
</script>
</body>
</html>
